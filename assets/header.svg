<svg width="1536" height="500" viewBox="0 0 1536 500"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <radialGradient id="bg" cx="50%" cy="48%" r="75%">
      <stop offset="0%"   stop-color="#1b1230"/>
      <stop offset="45%"  stop-color="#0f0a1d"/>
      <stop offset="100%" stop-color="#07050d"/>
    </radialGradient>

    <linearGradient id="lineLeft" x1="0" x2="1">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#a855f7" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity=".65"/>
    </linearGradient>

    <linearGradient id="lineRight" x1="1" x2="0">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#a855f7" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity=".65"/>
    </linearGradient>

    <filter id="glow"
            x="-200%"
            y="-200%"
            width="400%"
            height="400%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow"
            x="-200%"
            y="-200%"
            width="400%"
            height="400%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="bigGlow"
            x="-200%"
            y="-200%"
            width="400%"
            height="400%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="clip">
      <rect width="1536" height="500"/>
    </clipPath>

  </defs>

  <!-- FULL HEIGHT BACKGROUND -->
  <rect
    width="1536"
    height="500"
    fill="url(#bg)"/>

  <g clip-path="url(#clip)">

    <!-- Ambient central glow -->

    <ellipse
      cx="768"
      cy="250"
      rx="470"
      ry="190"
      fill="#7c3aed"
      opacity=".055"
      filter="url(#bigGlow)"/>


    <!-- ===================================================== -->
    <!-- LEFT NETWORK -->
    <!-- ===================================================== -->

    <g fill="none"
       stroke-linecap="round"
       stroke-linejoin="round">

      <path
        d="M-30 90
           L120 55
           L250 120
           L390 70
           L530 135
           L665 105
           L735 220"
        stroke="url(#lineLeft)"
        stroke-width="1.4"/>

      <path
        d="M-40 260
           L110 210
           L245 275
           L380 225
           L515 285
           L650 250
           L735 220"
        stroke="url(#lineLeft)"
        stroke-width="1.2"/>

      <path
        d="M30 480
           L130 390
           L265 430
           L400 350
           L540 390
           L650 300
           L735 220"
        stroke="url(#lineLeft)"
        stroke-width="1.15"/>

      <path d="M120 55 L110 210"/>
      <path d="M250 120 L245 275"/>
      <path d="M390 70 L380 225"/>
      <path d="M530 135 L515 285"/>
      <path d="M650 105 L650 250"/>

      <path d="M245 275 L265 430"/>
      <path d="M380 225 L400 350"/>
      <path d="M515 285 L540 390"/>

      <path d="M120 55 L245 275"
            stroke="#a855f7"
            stroke-opacity=".16"/>

      <path d="M250 120 L380 225"
            stroke="#a855f7"
            stroke-opacity=".20"/>

      <path d="M390 70 L515 285"
            stroke="#a855f7"
            stroke-opacity=".15"/>

      <path d="M530 135 L650 250"
            stroke="#a855f7"
            stroke-opacity=".20"/>

      <path d="M265 430 L515 285"
            stroke="#a855f7"
            stroke-opacity=".12"/>

    </g>


    <!-- ===================================================== -->
    <!-- RIGHT NETWORK -->
    <!-- ===================================================== -->

    <g fill="none"
       stroke-linecap="round"
       stroke-linejoin="round">

      <path
        d="M1566 90
           L1416 55
           L1286 120
           L1146 70
           L1006 135
           L871 105
           L801 220"
        stroke="url(#lineRight)"
        stroke-width="1.4"/>

      <path
        d="M1576 260
           L1426 210
           L1291 275
           L1156 225
           L1021 285
           L886 250
           L801 220"
        stroke="url(#lineRight)"
        stroke-width="1.2"/>

      <path
        d="M1506 480
           L1406 390
           L1271 430
           L1136 350
           L996 390
           L886 300
           L801 220"
        stroke="url(#lineRight)"
        stroke-width="1.15"/>

      <path d="M1416 55 L1426 210"/>
      <path d="M1286 120 L1291 275"/>
      <path d="M1146 70 L1156 225"/>
      <path d="M1006 135 L1021 285"/>
      <path d="M871 105 L886 250"/>

      <path d="M1291 275 L1271 430"/>
      <path d="M1156 225 L1136 350"/>
      <path d="M1021 285 L996 390"/>

      <path d="M1416 55 L1291 275"
            stroke="#a855f7"
            stroke-opacity=".16"/>

      <path d="M1286 120 L1156 225"
            stroke="#a855f7"
            stroke-opacity=".20"/>

      <path d="M1146 70 L1021 285"
            stroke="#a855f7"
            stroke-opacity=".15"/>

      <path d="M1006 135 L886 250"
            stroke="#a855f7"
            stroke-opacity=".20"/>

      <path d="M1271 430 L1021 285"
            stroke="#a855f7"
            stroke-opacity=".12"/>

    </g>


    <!-- ===================================================== -->
    <!-- SECONDARY CONNECTIONS -->
    <!-- ===================================================== -->

    <g fill="none"
       stroke="#a855f7"
       stroke-opacity=".10"
       stroke-width="1">

      <path d="M120 55 L390 70 L650 105"/>
      <path d="M1416 55 L1146 70 L886 105"/>

      <path d="M110 210 L380 225 L650 250"/>
      <path d="M1426 210 L1156 225 L886 250"/>

      <path d="M130 390 L400 350 L650 300"/>
      <path d="M1406 390 L1136 350 L886 300"/>

    </g>


    <!-- ===================================================== -->
    <!-- CENTRAL CONVERGENCE -->
    <!-- ===================================================== -->

    <g fill="none"
       stroke="#c084fc"
       stroke-linecap="round">

      <path d="M650 105 L705 155 L735 220"
            stroke-opacity=".34"
            stroke-width="1.2"/>

      <path d="M886 105 L831 155 L801 220"
            stroke-opacity=".34"
            stroke-width="1.2"/>

      <path d="M650 250 L700 235 L735 220"
            stroke-opacity=".25"/>

      <path d="M886 250 L836 235 L801 220"
            stroke-opacity=".25"/>

      <path d="M650 300 L705 270 L735 220"
            stroke-opacity=".20"/>

      <path d="M886 300 L831 270 L801 220"
            stroke-opacity=".20"/>

      <path d="M735 220 L768 205 L801 220"
            stroke-opacity=".45"
