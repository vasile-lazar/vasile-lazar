      <circle cx="250" cy="120" r="3"/>
      <circle cx="390" cy="70" r="3"/>
      <circle cx="530" cy="135" r="3"/>
      <circle cx="665" cy="105" r="3"/>

      <circle cx="110" cy="210" r="2.5"/>
      <circle cx="245" cy="275" r="3"/>
      <circle cx="380" cy="225" r="2.5"/>
      <circle cx="515" cy="285" r="3"/>

      <circle cx="130" cy="390" r="2.5"/>
      <circle cx="265" cy="430" r="3"/>
      <circle cx="400" cy="350" r="2.5"/>
      <circle cx="540" cy="390" r="3"/>

      <circle cx="1416" cy="55" r="3"/>
      <circle cx="1286" cy="120" r="3"/>
      <circle cx="1146" cy="70" r="3"/>
      <circle cx="1006" cy="135" r="3"/>
      <circle cx="871" cy="105" r="3"/>

      <circle cx="1426" cy="210" r="2.5"/>
      <circle cx="1291" cy="275" r="3"/>
      <circle cx="1156" cy="225" r="2.5"/>
      <circle cx="1021" cy="285" r="3"/>

      <circle cx="1406" cy="390" r="2.5"/>
      <circle cx="1271" cy="430" r="3"/>
      <circle cx="1136" cy="350" r="2.5"/>
      <circle cx="996" cy="390" r="3"/>

      <circle cx="735" cy="220" r="3.5"/>
      <circle cx="768" cy="205" r="4"/>
      <circle cx="801" cy="220" r="3.5"/>

    </g>


    <!-- ===================================================== -->
    <!-- ANIMATED PARTICLES -->
    <!-- ===================================================== -->

    <g fill="#f3e8ff"
       filter="url(#glow)">

      <circle r="2">
        <animateMotion
          dur="7s"
          repeatCount="indefinite"
          path="M-30 90 L120 55 L250 120 L390 70 L530 135 L665 105 L735 220 L768 205"/>
      </circle>

      <circle r="1.7">
        <animateMotion
          dur="8s"
          begin="-3s"
          repeatCount="indefinite"
          path="M-40 260 L110 210 L245 275 L380 225 L515 285 L650 250 L735 220"/>
      </circle>

      <circle r="1.8">
        <animateMotion
          dur="8.5s"
          begin="-5s"
          repeatCount="indefinite"
          path="M30 480 L130 390 L265 430 L400 350 L540 390 L650 300 L735 220"/>
      </circle>

      <circle r="2">
        <animateMotion
          dur="7s"
          begin="-2s"
          repeatCount="indefinite"
          path="M1566 90 L1416 55 L1286 120 L1146 70 L1006 135 L871 105 L801 220 L768 205"/>
      </circle>

      <circle r="1.7">
        <animateMotion
          dur="8s"
          begin="-4s"
          repeatCount="indefinite"
          path="M1576 260 L1426 210 L1291 275 L1156 225 L1021 285 L886 250 L801 220"/>
      </circle>

      <circle r="1.8">
        <animateMotion
          dur="8.5s"
          begin="-1s"
          repeatCount="indefinite"
          path="M1506 480 L1406 390 L1271 430 L1136 350 L996 390 L886 300 L801 220"/>
      </circle>

    </g>


    <!-- ===================================================== -->
    <!-- CENTRAL NAME PANEL -->
    <!-- ===================================================== -->

    <rect
      x="548"
      y="165"
      width="440"
      height="110"
      rx="18"
      fill="#8b5cf6"
      opacity=".10"
      filter="url(#softGlow)"/>

    <rect
      x="568"
      y="176"
      width="400"
      height="82"
      rx="14"
      fill="#0b0813"
      fill-opacity=".94"
      stroke="#a855f7"
      stroke-opacity=".30"
      stroke-width="1"/>

    <rect
      x="573"
      y="181"
      width="390"
      height="72"
      rx="11"
      fill="none"
      stroke="#c084fc"
      stroke-opacity=".055"/>

    <line
      x1="718"
      y1="176"
      x2="818"
      y2="176"
      stroke="#c084fc"
      stroke-opacity=".7"
      stroke-width="1"/>

    <text
      x="768"
      y="215"
      text-anchor="middle"
      dominant-baseline="middle"
      fill="#faf7ff"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      font-size="42"
      font-weight="700"
      letter-spacing="3.5">
      VASILE LAZĂR
    </text>

    <text
      x="768"
      y="244"
      text-anchor="middle"
      fill="#c084fc"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      font-size="12"
      letter-spacing="1.8">
      BACKEND · DATA · SYSTEMS · PROBLEM SOLVING
    </text>

    <circle
      cx="768"
      cy="205"
      r="5"
      fill="none"
      stroke="#c084fc"
      stroke-width="1"
      opacity=".5">

      <animate
        attributeName="r"
        values="5;16;5"
        dur="3.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".5;0;.5"
        dur="3.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>

  <!-- SHARP EDGE BORDER -->
  <rect
    x=".5"
    y=".5"
    width="1535"
    height="499"
    fill="none"
    stroke="#a855f7"
    stroke-opacity=".13"/>

</svg>