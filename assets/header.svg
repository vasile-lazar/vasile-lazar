    </g>


    <!-- ===================================================== -->
    <!-- NODE GLOWS -->
    <!-- ===================================================== -->

    <g fill="#a855f7"
       opacity=".25"
       filter="url(#softGlow)">

      <circle cx="120" cy="55" r="9"/>
      <circle cx="250" cy="120" r="8"/>
      <circle cx="390" cy="70" r="9"/>
      <circle cx="530" cy="135" r="8"/>
      <circle cx="665" cy="105" r="8"/>

      <circle cx="110" cy="210" r="8"/>
      <circle cx="245" cy="275" r="9"/>
      <circle cx="380" cy="225" r="8"/>
      <circle cx="515" cy="285" r="8"/>

      <circle cx="130" cy="390" r="8"/>
      <circle cx="265" cy="430" r="8"/>
      <circle cx="400" cy="350" r="8"/>
      <circle cx="540" cy="390" r="8"/>

      <circle cx="1416" cy="55" r="9"/>
      <circle cx="1286" cy="120" r="8"/>
      <circle cx="1146" cy="70" r="9"/>
      <circle cx="1006" cy="135" r="8"/>
      <circle cx="871" cy="105" r="8"/>

      <circle cx="1426" cy="210" r="8"/>
      <circle cx="1291" cy="275" r="9"/>
      <circle cx="1156" cy="225" r="8"/>
      <circle cx="1021" cy="285" r="8"/>

      <circle cx="1406" cy="390" r="8"/>
      <circle cx="1271" cy="430" r="8"/>
      <circle cx="1136" cy="350" r="8"/>
      <circle cx="996" cy="390" r="8"/>

