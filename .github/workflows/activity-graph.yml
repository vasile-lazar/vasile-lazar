name: Generate Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: vasile-lazar
        run: |
          python scripts/generate_activity_graph.py

      - name: Publish SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin output:output || true

          if git show-ref --verify --quiet refs/heads/output; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi

          mkdir -p .

          cp /tmp/activity-graph.svg activity-graph.svg

          git add activity-graph.svg

          if git diff --cached --quiet; then
            echo "No changes to activity graph."
          else
            git commit -m "Update contribution graph"
            git push origin output
          fi